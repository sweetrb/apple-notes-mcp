# Single-package repo (no workspace packages). This file records pnpm's
# build-script approvals, which pnpm 11 reads only from here (the package.json
# "pnpm" field and .npmrc are no longer read, and the v10 onlyBuiltDependencies
# array was replaced by the allowBuilds map). esbuild — a transitive vite/vitest
# dev dependency — ships a postinstall; approving it keeps `pnpm install` from
# failing with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true

# Supply-chain soak: refuse any package version younger than 7 days (10080 min).
# Deliberately stricter than pnpm 11's 1440-minute default, and deliberately NOT
# redundant with dependabot.yml's 7-day cooldown: the cooldown governs only what
# Dependabot *proposes* (direct deps), while this governs everything a resolution
# *installs*. Transitive packages reach the lockfile without Dependabot ever seeing
# them -- apple-mail-mcp carried a 5-day-old transitive ip-address@10.5.0 under the
# 1440 default, which this value rejects. See https://pnpm.io/supply-chain-security.
#
# Cost of the stricter value, stated here so it is not rediscovered painfully: an
# urgent upstream fix cannot be installed until it is 7 days old. There is no
# minimumReleaseAgeExclude carve-out; if one is ever needed, add it narrowly and
# remove it once the version ages past the cutoff.
minimumReleaseAge: 10080

# The MCP SDK currently caps these transitive dependencies below their first
# fully patched releases. Keep the overrides until the SDK's ranges move past
# these security fixes.
overrides:
  "@hono/node-server": 2.0.10
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 (high): unbounded brace expansion.
  # Dev toolchain only -- brace-expansion is not in the shipped bundle -- but
  # three separate majors are reachable here (eslint -> minimatch@3 -> v1,
  # minimatch@9 -> v2, minimatch@10 -> v5), so each is floored independently
  # on its own complete release.
  #
  # The advisory's first-patched versions (1.1.17 / 2.1.3 / 5.0.8) are NOT
  # sufficient: they bound the accumulator in combine() but never thread
  # maxLength into expandSequence(), leaving the sequence path ({1..N},
  # {a..z..k}) capped only by item count. 1.1.18 / 2.1.4 / 5.0.9 add it.
  #
  # The bounds must be two-sided. A bare "<5.0.9" also matches 1.1.18 and
  # 2.1.4 under semver, and would force minimatch 3's CommonJS path onto the
  # v5 ESM API ("expand is not a function").
  "brace-expansion@>=1.0.0 <1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  # ⚠️ These are FLOORS, not pins. `fast-uri: 3.1.4` (exact) was written here as a
  # security floor and then became a CEILING: when GHSA-7p8r-x3mc-p8w7 (high, host
  # confusion via a backslash authority introducer) landed with a 3.1.5 fix, the
  # exact pin held the tree on the vulnerable 3.1.4 and the advisory could never
  # clear. Use a range so patch fixes flow in on their own while staying inside
  # the major the parent's API expects. fast-uri IS in the shipped bundle (via
  # @modelcontextprotocol/sdk -> ajv), so this one ships.
  #
  # Raised from ^3.1.5 to >=3.1.6 <4 (still two-sided, still capped below 4.x)
  # because ^3.1.5 itself was satisfied by the already-installed, already-
  # vulnerable 3.1.5 and pnpm never re-resolved past it. Four more GHSAs landed
  # against 3.1.5 (fixed in 3.1.6): GHSA-jqff-g426-hqxp (host confusion via
  # percent-encoded scheme normalization), GHSA-fph4-wmhf-6fwf (SSRF via
  # repeated hostname percent-decoding), GHSA-f65p-4m7j-42xc (SSRF via
  # malformed IPv6 normalization), GHSA-5jgf-p345-68v8 (host confusion via
  # skipped IDN canonicalization). Do not float to 4.x (latest on npm) without
  # confirming ajv's fast-uri range accepts it.
  fast-uri: ">=3.1.6 <4"
  # GHSA-mwp4-54f8-5fhr (high, leading-zero octets decoded as decimal -> SSRF /
  # trust-boundary bypass) plus GHSA-4xrf-jv44-h6hh and GHSA-22jq-vg5j-6vgg.
  # Reached via @modelcontextprotocol/sdk -> express-rate-limit, which caps
  # ip-address at 10.2.0. Not in the shipped bundle (0 references in
  # build/index.js), but floored anyway so the SDK cannot reintroduce it.
  ip-address: ^10.3.1
  # GHSA-fxqj-rqcc-2cmp (moderate): incomplete fix of GHSA-6g55-p6wh-862q.
  # Dev-only (vitest -> vite -> postcss); not in the shipped bundle.
  postcss: ^8.5.23
  # GHSA-8j4g-w8fx-2239 (ReDoS in Hono's CORS middleware). Deferred on 2026-08-03
  # because 4.12.34 was still inside the 24h minimumReleaseAge gate — it missed by
  # 2m36s. It matured at 2026-08-04T02:36:40Z and is floored here now, with no
  # minimumReleaseAgeExclude carve-out ever having been added.
  #
  # Raised to ^4.13.5 on 2026-09-09 for three more advisories, all with the range
  # < 4.13.5: GHSA-gqvv-2mrq-wpjv (incomplete fix for CVE-2026-39408 — toSSG()
  # still writes files outside the output directory), GHSA-g6gw-c38x-mqfc
  # (unbounded dot-notation nesting in parseBody() -> memory exhaustion), and
  # GHSA-crvj-82cr-hjcx (the query parser reads parameters after the URL fragment,
  # giving cache-key / proxy interpretation differentials). Reached via
  # @modelcontextprotocol/sdk -> @hono/node-server; NOT in the shipped bundle,
  # since this stdio server tree-shakes the HTTP transports out. Dependabot never
  # alerted on this repo (an alert-rollout timing artifact — only apple-numbers-mcp
  # got the alerts), but the identical vulnerable version was carried here.
  # Caret range, never an exact pin, for the reason recorded on fast-uri above.
  hono: ^4.13.5
  # GHSA-5p4m-2wfm-xmqj (high): quadratic CPU consumption resolving !!omap,
  # fixed in 4.3.1 — the CVE-2026-59870 fix was never backported to the 3.x line.
  # Reached as eslint -> js-yaml, so development scope, and absent from the
  # shipped build/index.js bundle: nothing vulnerable was ever published. Floored
  # as a caret range, never an exact pin, for the reason recorded on fast-uri above.
  #
  # Raised to ^4.3.2 on 2026-09-09 for GHSA-2883-xcg3-v3hh (range >= 4.0.0,
  # < 4.3.2): maxTotalMergeKeys does not bound CPU use when the merge sources are
  # empty, so the earlier merge-key cap can still be walked into quadratic work.
  # Same reachability as above — eslint -> @eslint/eslintrc -> js-yaml, so
  # development scope — and still absent from the shipped build/index.js bundle.
  js-yaml: ^4.3.2
  # GHSA-x5fp-wj9c-mxmx (medium, array-limit bypass via bracket-key comma
  # parsing) and GHSA-4mjr-xmp4-gh2g (medium, DoS via attacker-controlled
  # isBuffer), both fixed in 6.16.0. Reached via @modelcontextprotocol/sdk ->
  # express -> body-parser/express-rate-limit. This server is stdio-only, so
  # the HTTP path is never entered -- exposure is near-zero -- but the floor
  # still needs raising to close the alerts. Deferred until 2026-09-05T23:50Z
  # for the 7-day minimumReleaseAge soak on 6.16.0 (published 2026-08-29); the
  # soak cleared naturally by 2026-09-06. Two-sided range, never an exact pin,
  # for the reason recorded on fast-uri above.
  qs: ">=6.16.0 <7"
