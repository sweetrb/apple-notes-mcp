name: version-guard

# Fail any PR to main that changes SHIPPED BYTES without bumping package.json's
# version. Shipped bytes = the committed esbuild bundle under build/** (it IS
# what npm and marketplace users run), plus the files package.json `files[]`
# ships verbatim (requirements.txt and the src/**/*.py sidecars), plus the
# RUNTIME `dependencies` map in package.json. build/** was added 2026-07-20:
# it subsumes every cause that changes what users receive — direct deps,
# lockfile-only transitive bumps, and esbuild codegen changes — none of which
# the src/deps detectors could see (a lockfile-only runtime-dep bump merged
# un-bumped on 2026-07-15 and sat unshipped for two days).
# Docs-only, test-only, and github-actions changes stay exempt; byte-neutral
# devDependency bumps stay exempt because they leave build/ untouched.
# Rationale: publish.yml only publishes when the version is absent from npm,
# so an un-bumped shipped-byte change silently never releases. This guard
# makes the bump mandatory; dependabot-rebuild.yml auto-bumps bot PRs whose
# rebuilt bundle changed, so Dependabot automation keeps flowing.
# The guard file itself lives in .github/ (doesn't ship), so it needs no bump.
# A bump must also be DOCUMENTED: when the version changes, CHANGELOG.md has to
# carry a matching "## [X.Y.Z]" heading, so release notes can't be stranded
# under "## [Unreleased]" and silently orphaned once the release ships.
#
# TypeScript under src/ is a FIRST-CAUSE DETECTOR, not a shipped file: it
# reaches users only after esbuild inlines it into build/index.js. So it only
# implies a bump when build/** changed too — a src/**/*.ts edit that leaves the
# committed bundle byte-identical (comments, formatting, types) ships nothing
# and owes no version. That is safe because ci.yml's "Verify committed build/
# matches source" step rebuilds and requires `git diff --quiet build/`, and it
# runs in the `test` job whose `test (22)`/`test (24)` contexts are REQUIRED by
# branch protection — so at merge time an unchanged build/ provably matches
# src/. Keep that step and its required contexts, or this exemption loses its
# proof (conformance-check.sh asserts both).
# Everything else under src/ (the .py sidecars, which package.json ships
# verbatim rather than bundling) stays an unconditional detector, and the rule
# is written fail-safe: only `.ts` is treated as bundle-only, so any new file
# type added under src/ defaults to requiring a bump.

on:
  pull_request:
    branches: [main]
  # Re-dispatched by dependabot-rebuild.yml after it pushes a rebuilt bundle
  # to a Dependabot PR branch: a GITHUB_TOKEN push only creates held,
  # approval-required pull_request runs, so this required check has to be
  # re-run via dispatch to complete on the new head.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a version bump when shipped bytes change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Under workflow_dispatch there is no PR context — fall back to the
          # fork point from origin/main (same semantics as the PR's triple-dot
          # diff). Fetch main explicitly so merge-base cannot depend on
          # checkout side effects.
          if [ -z "${BASE_SHA}" ]; then
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
            BASE_SHA="$(git merge-base origin/main HEAD)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'

          # Files that ARE shipped bytes: the committed bundle itself, plus
          # everything package.json ships verbatim (requirements.txt and the
          # non-.ts sources — i.e. the python sidecars). Anything new under
          # src/ that is not .ts lands here too, which is the fail-safe side.
          ships="$(printf '%s\n' "$changed" \
            | grep -E '^(build/.*|requirements\.txt|src/.*)$' \
            | grep -vE '^src/.*\.ts$' \
            | grep -vE '(/__tests__/|/__mocks__/)' || true)"

          # TypeScript sources reach users only through the bundle, so they
          # imply a bump only when the bundle actually moved. Listed alongside
          # build/** purely for a better error message.
          ts="$(printf '%s\n' "$changed" \
            | grep -E '^src/.*\.ts$' \
            | grep -vE '(\.test\.ts$|\.spec\.ts$|/__tests__/|/__mocks__/)' || true)"
          bundle_changed="$(printf '%s\n' "$changed" | grep -E '^build/' || true)"

          code="$ships"
          if [ -n "$ts" ] && [ -n "$bundle_changed" ]; then
            code="$(printf '%s\n%s' "$ships" "$ts" | grep -v '^$' || true)"
          elif [ -n "$ts" ]; then
            echo "::notice::src/ TypeScript changed but the committed bundle is byte-identical — nothing ships, so no version bump is required. (ci.yml's build-verify step proves build/ matches src/.)"
          fi

          # Runtime deps are shipped code too: they are inlined into the
          # committed bundle. Compare only the `dependencies` map —
          # devDependencies stay exempt so dev-dep automerge is unaffected
          # (a devDep bump that changes the bundle is caught by build/**).
          deps_changed=""
          if printf '%s\n' "$changed" | grep -qx 'package.json'; then
            old_deps="$(git show "${BASE_SHA}:package.json" | jq -cS '.dependencies // {}')"
            new_deps="$(git show "${HEAD_SHA}:package.json" | jq -cS '.dependencies // {}')"
            if [ "$old_deps" != "$new_deps" ]; then
              deps_changed=1
              echo "Runtime dependencies changed:"
              echo "  base: $old_deps"
              echo "  head: $new_deps"
            fi
          fi

          oldv="$(git show "${BASE_SHA}:package.json" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          newv="$(node -e 'console.log(require("./package.json").version)')"
          echo "package.json version: base=${oldv}  head=${newv}"

          if [ "$oldv" != "$newv" ]; then
            # Bump present: require it to be an increase (typo'd downgrades)…
            OLDV="$oldv" NEWV="$newv" node -e '
              const a = process.env.OLDV.split(".").map(Number);
              const b = process.env.NEWV.split(".").map(Number);
              const cmp = (b[0]-a[0]) || (b[1]-a[1]) || (b[2]-a[2]);
              if (cmp > 0) { console.log("Version bumped " + process.env.OLDV + " -> " + process.env.NEWV + "."); process.exit(0); }
              console.error("::error::package.json version went " + process.env.OLDV + " -> " + process.env.NEWV + " (not an increase). Bump it forward.");
              process.exit(1);
            '
            # …and require it to be UNPUBLISHED. Two concurrently-open PRs can
            # each bump to the same next patch; without this, the second merge
            # is a version collision publish.yml silently skips. Registry
            # errors fail open (a registry outage must not block merges).
            PKG="$(node -p "require('./package.json').name")"
            set +e
            existing="$(npm view "${PKG}@${newv}" version 2>/dev/null)"
            set -e
            if [ -n "$existing" ]; then
              echo "::error::${PKG}@${newv} is already published on npm — this bump collides with an existing release (another PR likely claimed it first). Rebase on main and bump again:  pnpm version patch --no-git-tag-version"
              exit 1
            fi
            echo "${PKG}@${newv} is unclaimed on npm."

            # …and require CHANGELOG.md to document it under a REAL version
            # heading. An entry parked under "## [Unreleased]" is orphaned the
            # moment the release ships: nothing in the release path renames
            # that section (the `version` lifecycle script only syncs the
            # plugin manifests), so the published version ends up undocumented
            # while its notes sit under a heading claiming they are unreleased.
            # apple-notes-mcp shipped 2.6.10 and 2.6.11 exactly that way before
            # this check existed. dependabot-rebuild.yml already inserts a real
            # heading, so bot PRs pass unchanged.
            esc="$(printf '%s' "${newv}" | sed 's/\./\\./g')"
            if ! grep -qE "^## \[${esc}\]" CHANGELOG.md; then
              echo "::error::package.json bumped to ${newv} but CHANGELOG.md has no '## [${newv}]' heading. Move this release's notes out of '## [Unreleased]' and file them under '## [${newv}] - $(date -u +%Y-%m-%d)'. Keep an empty '## [Unreleased]' at the top — dependabot-rebuild.yml hard-fails without that marker."
              exit 1
            fi
            echo "CHANGELOG.md documents ${newv}."
          fi

          if [ -z "$code" ] && [ -z "$deps_changed" ]; then
            echo "::notice::No shipped-byte changes — version bump not required."
            exit 0
          fi
          if [ -n "$code" ]; then
            echo "Shipped-byte changes detected:"; printf '%s\n' "$code" | sed 's/^/  /'
          fi

          if [ "$oldv" = "$newv" ]; then
            if [ -n "$deps_changed" ]; then
              echo "::error::Runtime dependencies changed (the shipped bundle changes) but package.json version is unchanged (${oldv}). Bump at least a patch + add a CHANGELOG entry so publish.yml actually ships the dependency update:  pnpm version patch --no-git-tag-version"
            else
              echo "::error::Shipped bytes changed (the committed build/ bundle, requirements.txt, or a verbatim-shipped src/ file) but package.json version is unchanged (${oldv}). Bump it at least a patch:  pnpm version patch --no-git-tag-version  (and add a CHANGELOG entry)."
            fi
            exit 1
          fi
          echo "Shipped bytes changed and version is bumped — OK."
